[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fasterapi"
version = "0.1.0"
description = "1:1 FastAPI drop-in replacement with a native Rust (PyO3) core — radix routing, SIMD JSON, type-safe validators, edge guards"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Seyamalam" }]
keywords = ["fastapi", "web", "rust", "pyo3", "performance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  # Minimal runtime: Starlette (HTTP engine) + Pydantic v2 (validation).
  # TestClient users also need httpx -> install the `standard` extra.
  "starlette>=0.37",
  "pydantic>=2.0",
]

[project.optional-dependencies]
standard = [
  "uvicorn>=0.29",
  "httpx>=0.24",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.24",
  "python-multipart>=0.0.9",
]
bench = [
  "uvicorn>=0.29",
  "httpx>=0.24",
  "psutil>=5.9",
]

[project.scripts]
fasterapi = "fasterapi.cli:main"

[project.urls]
Homepage = "https://github.com/Seyamalam/fasterapi"
Repository = "https://github.com/Seyamalam/fasterapi"
Issues = "https://github.com/Seyamalam/fasterapi/issues"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "fasterapi._fasterapi_rs"
python-source = "python"
# Pure-Python fallback works without compiling; Rust ext accelerates routing/JSON/rate-limit.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
