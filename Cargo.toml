[package]
name = "fasterapi"
version = "0.1.0"
edition = "2021"
description = "Ultra-high-performance FastAPI drop-in replacement — Rust (Tokio + Hyper + PyO3) core, Python 3.13+ free-threaded ready"
license = "MIT"
repository = "https://github.com/Seyamalam/fasterapi"
rust-version = "1.75"

[lib]
name = "_fasterapi_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "fs"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
matchit = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = { version = "0.13", features = ["serde_impl"] }
governor = "0.6"
parking_lot = "0.12"
smallvec = "1"
bytes = "1"
futures-util = "0.3"
once_cell = "1"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
