[package]
name = "fasterapi"
version = "0.1.0"
edition = "2021"
description = "1:1 FastAPI drop-in replacement with a native Rust (PyO3) core — radix routing, SIMD JSON, type-safe validators, edge guards"
license = "MIT"
repository = "https://github.com/Seyamalam/fasterapi"
rust-version = "1.75"

[lib]
name = "_fasterapi_rs"
crate-type = ["cdylib"]

[dependencies]
# Minimal native core: only what the shipped fast-paths actually use.
pyo3 = { version = "0.22", features = ["extension-module"] }
matchit = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = { version = "0.13", features = ["serde_impl"] }
governor = "0.6"
parking_lot = "0.12"
regex = "1"
percent-encoding = "2"
# Hyper host spike (tasks: Rust owns sockets + HTTP parsing, Python runs the
# ASGI app in-process). Minimal features only.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
