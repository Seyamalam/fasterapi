<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="fasterapi logo">
  <defs>
    <linearGradient id="fa-g" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00bfa5"/>
      <stop offset="0.55" stop-color="#00a08c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="fa-bolt" x1="22" y1="10" x2="44" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
    <filter id="fa-s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.6" flood-color="#0f2e28" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- rounded hexagon badge -->
  <path d="M32 3.2 56.4 17.3v28.4L32 59.8 7.6 45.7V17.3Z"
        fill="url(#fa-g)" stroke="url(#fa-g)" stroke-width="6" stroke-linejoin="round"
        filter="url(#fa-s)"/>
  <!-- inner facet lines for depth -->
  <path d="M32 9.5 50.6 20.2" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  <path d="M13.5 21.8 32 11.2" stroke="#07332b" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <!-- lightning bolt -->
  <path d="M37.8 10.5 19.2 35.4h9.4L24.6 53.5l20.6-27.1h-9.9Z"
        fill="url(#fa-bolt)" stroke="#083c33" stroke-opacity="0.35" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
